[package]
name = "cluster_overview"
version = "1.0.0"
edition = "2021"
description = "Profesjonelt klyngeanalyse-verktøy i Rust med 200 algoritmer, native GUI og PDF-rapportgenerator"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
egui_extras = "0.31"
rfd = "0.15"
csv = "1.3"
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
pdf-writer = "0.12"
flate2 = "1.0"
chrono = "0.4"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
